<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="عاجل الآن — الخبر لحظة بلحظة: أخبار عاجلة وتحليلات معمقة في السياسة والاقتصاد والتقنية والرياضة والثقافة." />
    <meta name="theme-color" content="#0D1B2A" />
    <title>عاجل الآن | الخبر لحظة بلحظة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // منع وميض الوضع الليلي قبل تحميل React
      try {
        var t = localStorage.getItem("ajal-theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
